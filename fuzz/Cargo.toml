[package]
name = "sar-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sar-core]
path = "../crates/sar-core"

[dependencies.sar-archive]
path = "../crates/sar-archive"

[dependencies.sar-stream]
path = "../crates/sar-stream"

[dependencies.sar-transport]
path = "../crates/sar-transport"

[dependencies.sar-sparse]
path = "../crates/sar-sparse"

[dependencies.sar-crypto]
path = "../crates/sar-crypto"

