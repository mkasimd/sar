[package]
name = "sar-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
## Enable SAR-over-QUIC transport binding (adds quinn, rustls, and tokio deps).
quic = [
    "dep:quinn",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio",
]

[dependencies]
sar-core = { path = "../sar-core" }
sar-archive = { path = "../sar-archive" }
sar-stream = { path = "../sar-stream" }
sar-crypto = { path = "../sar-crypto" }
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync"], optional = true }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
zeroize = { workspace = true }

[lints]
workspace = true
